<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 따릉이 대여소 현황</title>
    <style>
        /* ==========================================================================
           1. CSS Variables & Theme Configuration
           ========================================================================== */
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --bg-secondary: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --text-muted: #94a3b8;
            
            /* Dynamic Theme Accent Color (Default Green) */
            --accent-main: #10b981;
            --accent-bg: #ecfdf5;
            --accent-border: #a7f3d0;

            /* Accent Colors */
            --bike-green: #10b981;
            --bike-green-bg: #ecfdf5;
            --bike-green-border: #a7f3d0;
            
            --bike-red: #ef4444;
            --bike-red-bg: #fef2f2;
            --bike-red-border: #fca5a5;

            --bike-amber: #f59e0b;
            --bike-amber-bg: #fffbeb;

            --primary: var(--accent-main);
            --primary-hover: #059669;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-secondary: #334155;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --text-muted: #64748b;

            --bike-green-bg: rgba(16, 185, 129, 0.15);
            --bike-green-border: rgba(16, 185, 129, 0.4);

            --bike-red-bg: rgba(239, 68, 68, 0.18);
            --bike-red-border: rgba(239, 68, 68, 0.4);

            --bike-amber-bg: rgba(245, 158, 11, 0.15);
        }

        /* Color Theme Presets */
        body[data-color="green"] {
            --accent-main: #10b981;
            --accent-bg: #ecfdf5;
            --accent-border: #a7f3d0;
            --primary-hover: #059669;
        }
        body[data-color="blue"] {
            --accent-main: #0284c7;
            --accent-bg: #f0f9ff;
            --accent-border: #bae6fd;
            --primary-hover: #0369a1;
        }
        body[data-color="purple"] {
            --accent-main: #8b5cf6;
            --accent-bg: #f5f3ff;
            --accent-border: #ddd6fe;
            --primary-hover: #7c3aed;
        }
        body[data-color="orange"] {
            --accent-main: #f97316;
            --accent-bg: #fff7ed;
            --accent-border: #ffedd5;
            --primary-hover: #ea580c;
        }

        /* Palette Picker Buttons */
        .color-picker {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background-color: var(--bg-secondary);
            padding: 0.25rem 0.4rem;
            border-radius: var(--radius-full);
        }

        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: var(--text-main);
            transform: scale(1.15);
        }

        .dot-green { background-color: #10b981; }
        .dot-blue { background-color: #0284c7; }
        .dot-purple { background-color: #8b5cf6; }
        .dot-orange { background-color: #f97316; }

        /* Visual Distribution Chart Bar */
        .visual-summary-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.1rem 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .visual-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.65rem;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .stacked-bar-wrapper {
            width: 100%;
            height: 14px;
            background-color: var(--bg-secondary);
            border-radius: var(--radius-full);
            display: flex;
            overflow: hidden;
            gap: 2px;
        }

        .stacked-bar-segment {
            height: 100%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .bar-plenty { background-color: var(--accent-main); }
        .bar-low { background-color: var(--bike-amber); }
        .bar-zero { background-color: var(--bike-red); }

        .visual-legend {
            display: flex;
            gap: 1.25rem;
            font-size: 0.775rem;
            color: var(--text-sub);
            margin-top: 0.65rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Bike Slot Visual Dots */
        .bike-visual-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            min-height: 20px;
        }

        .bike-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            background-color: var(--accent-main);
            transition: transform 0.2s ease;
        }

        .bike-dot.empty {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .bike-dot.zero-dot {
            background-color: var(--bike-red);
        }

        /* Quick Sort Buttons */
        .btn-quick-sort {
            font-size: 0.8rem;
            padding: 0.45rem 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s ease;
        }

        .btn-quick-sort:hover, .btn-quick-sort.active {
            background-color: var(--accent-bg);
            border-color: var(--accent-border);
            color: var(--accent-main);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-secondary: #334155;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --text-muted: #64748b;

            --bike-green-bg: rgba(16, 185, 129, 0.15);
            --bike-green-border: rgba(16, 185, 129, 0.4);

            --bike-red-bg: rgba(239, 68, 68, 0.18);
            --bike-red-border: rgba(239, 68, 68, 0.4);

            --bike-amber-bg: rgba(245, 158, 11, 0.15);
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.25rem 2.5rem;
        }

        /* Header */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-main), var(--primary-hover));
            color: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .brand-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-main);
        }

        .title-group p {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.65rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .status-badge.live {
            background-color: var(--bike-green-bg);
            color: var(--bike-green);
            border: 1px solid var(--bike-green-border);
        }

        .status-badge.sample {
            background-color: var(--bike-amber-bg);
            color: var(--bike-amber);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .updated-time {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: right;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.55rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-main);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background-color: var(--bg-secondary);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-icon-only {
            padding: 0.55rem;
            border-radius: var(--radius-md);
        }

        .btn-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .spin {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Dashboard KPI Summary */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .kpi-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.25rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .kpi-label {
            font-size: 0.825rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .kpi-value-group {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .kpi-value {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .kpi-unit {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-sub);
            margin-left: 0.2rem;
        }

        .kpi-card.alert {
            border-color: var(--bike-red-border);
            background-color: var(--bike-red-bg);
        }

        .kpi-card.alert .kpi-value {
            color: var(--bike-red);
        }

        /* Filter Controls */
        .controls-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-box input {
            width: 100%;
            padding: 0.65rem 1rem 0.65rem 2.6rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .clear-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem;
            display: none;
            border-radius: 50%;
        }

        .clear-btn:hover {
            color: var(--text-main);
            background-color: var(--bg-secondary);
        }

        .filter-tabs {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background-color: var(--bg-secondary);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            overflow-x: auto;
        }

        .tab-btn {
            border: none;
            background: none;
            padding: 0.45rem 0.85rem;
            font-size: 0.825rem;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: var(--radius-sm);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--bg-card);
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
        }

        .view-switchers {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .select-input {
            padding: 0.55rem 0.85rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* Station Cards Grid */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .station-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .station-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* 0 Bikes Alert Style */
        .station-card.zero-bikes {
            border-color: var(--bike-red-border);
            background: linear-gradient(180deg, var(--bike-red-bg) 0%, var(--bg-card) 60px);
        }

        .station-card.zero-bikes::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--bike-red);
        }

        .station-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .station-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.35;
            word-break: keep-all;
        }

        .station-id {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            background-color: var(--bg-secondary);
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .station-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            background-color: var(--bg-primary);
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
        }

        .metric-item {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 0.15rem;
        }

        .metric-val {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .zero-text {
            color: var(--bike-red);
        }

        .green-text {
            color: var(--bike-green);
        }

        /* Progress / Gauge Bar */
        .progress-section {
            margin-top: 0.25rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--bg-secondary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: var(--radius-full);
            transition: width 0.4s ease;
        }

        .bg-green {
            background-color: var(--bike-green);
        }

        .bg-red {
            background-color: var(--bike-red);
        }

        .bg-amber {
            background-color: var(--bike-amber);
        }

        .card-footer {
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .badge-status {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
        }

        .badge-zero {
            background-color: var(--bike-red);
            color: white;
        }

        .badge-available {
            background-color: var(--bike-green-bg);
            color: var(--bike-green);
        }

        /* Table View Component */
        .table-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .responsive-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        .responsive-table th, 
        .responsive-table td {
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .responsive-table th {
            background-color: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-sub);
            user-select: none;
        }

        .responsive-table tr:last-child td {
            border-bottom: none;
        }

        .responsive-table tr.zero-row {
            background-color: var(--bike-red-bg);
        }

        .responsive-table tr:hover {
            background-color: var(--bg-secondary);
        }

        /* Interactive Map SVG Visualizer */
        .map-wrapper {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .svg-map-container {
            width: 100%;
            height: 420px;
            background-color: var(--bg-primary);
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .svg-map {
            width: 100%;
            height: 100%;
        }

        .map-pin {
            cursor: pointer;
            transition: transform 0.2s ease, fill 0.2s ease;
        }

        .map-pin:hover {
            transform: scale(1.4);
        }

        .map-tooltip {
            position: absolute;
            background-color: var(--bg-card);
            color: var(--text-main);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            pointer-events: none;
            display: none;
            z-index: 20;
            white-space: nowrap;
        }

        /* State Empty / Loading View */
        .state-view {
            text-align: center;
            padding: 4rem 1.5rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-top: 1rem;
        }

        .state-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            color: var(--text-muted);
        }

        .state-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .state-desc {
            font-size: 0.875rem;
            color: var(--text-sub);
            max-width: 400px;
            margin: 0 auto;
        }

        /* Toast Popup */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: var(--text-main);
            color: var(--bg-primary);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Responsive tweaks */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                min-width: 100%;
            }
            .stations-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- App Header -->
    <header>
        <div class="header-content">
            <div class="brand-area">
                <div class="brand-icon" title="서울 따릉이 대여소 현황">
                    <svg viewBox="0 0 24 24">
                        <circle cx="5.5" cy="17.5" r="3.5"></circle>
                        <circle cx="18.5" cy="17.5" r="3.5"></circle>
                        <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5l2-6 3.5 2.5"></path>
                        <path d="M5.5 17.5l5.5-9h4"></path>
                    </svg>
                </div>
                <div class="title-group">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <h1>서울 따릉이 현황</h1>
                        <span id="dataStatusBadge" class="status-badge sample">
                            <span class="status-dot"></span>
                            <span id="dataStatusText">데이터 불러오는 중...</span>
                        </span>
                    </div>
                    <p>실시간 따릉이 대여소 정보 및 잔여 자전거 모니터링</p>
                </div>
            </div>

            <div class="header-actions">
                <!-- Color Theme Selector -->
                <div class="color-picker" title="테마 색상 변경">
                    <span class="color-dot dot-green active" onclick="changeAccentColor('green')" title="초록 테마"></span>
                    <span class="color-dot dot-blue" onclick="changeAccentColor('blue')" title="파랑 테마"></span>
                    <span class="color-dot dot-purple" onclick="changeAccentColor('purple')" title="보라 테마"></span>
                    <span class="color-dot dot-orange" onclick="changeAccentColor('orange')" title="주황 테마"></span>
                </div>

                <div class="updated-time">
                    <div>마지막 갱신 시각</div>
                    <strong id="lastUpdatedText" style="color: var(--text-main);">-</strong>
                </div>

                <button id="refreshBtn" class="btn btn-primary" onclick="loadBikeData()">
                    <span class="btn-icon">
                        <svg id="refreshIcon" viewBox="0 0 24 24">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6"></path>
                            <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M2.5 16l1 1A10 10 0 0 0 22 12.5"></path>
                        </svg>
                    </span>
                    <span>새로고침</span>
                </button>

                <button id="themeToggleBtn" class="btn btn-icon-only" onclick="toggleTheme()" title="다크/라이트 모드 전환">
                    <span class="btn-icon">
                        <svg id="themeIcon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5"></circle>
                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Layout -->
    <main class="container">

        <!-- Visual Distribution Overview Bar (시각자료 현황 그래프) -->
        <section class="visual-summary-container">
            <div class="visual-summary-header">
                <span>실시간 대여 가능 현황 분포 (시각 자료)</span>
                <span id="visualSummaryPercent" style="color: var(--text-sub); font-size: 0.775rem;">계산 중...</span>
            </div>
            <div class="stacked-bar-wrapper">
                <div id="barPlenty" class="stacked-bar-segment bar-plenty" style="width: 0%" title="여유 (5대 이상)"></div>
                <div id="barLow" class="stacked-bar-segment bar-low" style="width: 0%" title="부족 (1~4대)"></div>
                <div id="barZero" class="stacked-bar-segment bar-zero" style="width: 0%" title="대여 불가 (0대)"></div>
            </div>
            <div class="visual-legend">
                <div class="legend-item"><span class="legend-dot" style="background-color: var(--accent-main);"></span> 여유 (5대 이상): <strong id="countPlentyText">0</strong>개소</div>
                <div class="legend-item"><span class="legend-dot" style="background-color: var(--bike-amber);"></span> 부족 (1~4대): <strong id="countLowText">0</strong>개소</div>
                <div class="legend-item"><span class="legend-dot" style="background-color: var(--bike-red);"></span> 대여 불가 (0대): <strong id="countZeroText">0</strong>개소</div>
            </div>
        </section>

        <!-- KPI Summary Cards -->
        <section class="kpi-grid">
            <div class="kpi-card">
                <span class="kpi-label">검색/전체 대여소</span>
                <div class="kpi-value-group">
                    <span class="kpi-value" id="kpiTotalStations">0</span>
                    <span class="kpi-unit">개소</span>
                </div>
            </div>

            <div class="kpi-card">
                <span class="kpi-label">대여 가능 자전거</span>
                <div class="kpi-value-group">
                    <span class="kpi-value green-text" id="kpiTotalBikes">0</span>
                    <span class="kpi-unit">대</span>
                </div>
            </div>

            <div class="kpi-card" id="kpiZeroCard">
                <span class="kpi-label">대여 불가 대여소 (0대)</span>
                <div class="kpi-value-group">
                    <span class="kpi-value" id="kpiZeroStations">0</span>
                    <span class="kpi-unit">개소</span>
                </div>
            </div>

            <div class="kpi-card">
                <span class="kpi-label">평균 거치율</span>
                <div class="kpi-value-group">
                    <span class="kpi-value" id="kpiAvgShared">0</span>
                    <span class="kpi-unit">%</span>
                </div>
            </div>
        </section>

        <!-- Search & Control Panel -->
        <section class="controls-section">
            <div class="controls-row">
                <!-- Search Input -->
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="대여소 이름 검색 (예: 망원역, 합정역)" oninput="handleSearchInput()">
                    <button id="clearSearchBtn" class="clear-btn" onclick="clearSearch()" title="검색어 초기화">✕</button>
                </div>

                <!-- Sort & View Switches -->
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                    <!-- Quick Sort Buttons -->
                    <button class="btn-quick-sort" id="quickSortDesc" onclick="setQuickSort('bike-desc')">
                        자전거 많은순 ⬇
                    </button>
                    <button class="btn-quick-sort" id="quickSortAsc" onclick="setQuickSort('bike-asc')">
                        자전거 적은순 ⬆
                    </button>

                    <select id="sortSelect" class="select-input" onchange="handleFilterSort()">
                        <option value="name-asc">대여소 이름순 (가나다)</option>
                        <option value="bike-desc">자전거 많은순 (최다)</option>
                        <option value="bike-asc">자전거 적은순 (최소)</option>
                        <option value="shared-desc">거치율 높은순 ⬇</option>
                        <option value="shared-asc">거치율 낮은순 ⬆</option>
                        <option value="rack-desc">총 거치대 많은순 ⬇</option>
                    </select>

                    <div class="filter-tabs">
                        <button class="tab-btn active" id="viewGridBtn" onclick="setViewMode('grid')">카드 뷰</button>
                        <button class="tab-btn" id="viewTableBtn" onclick="setViewMode('table')">테이블 뷰</button>
                        <button class="tab-btn" id="viewMapBtn" onclick="setViewMode('map')">위치 맵</button>
                    </div>
                </div>
            </div>

            <div class="controls-row">
                <!-- Status Filter Tabs -->
                <div class="filter-tabs" id="statusFilterGroup">
                    <button class="tab-btn active" data-filter="all" onclick="setStatusFilter('all')">전체 보기</button>
                    <button class="tab-btn" data-filter="available" onclick="setStatusFilter('available')">대여 가능만 (>0대)</button>
                    <button class="tab-btn" data-filter="zero" onclick="setStatusFilter('zero')">🚨 대여 불가 (0대)</button>
                    <button class="tab-btn" data-filter="plenty" onclick="setStatusFilter('plenty')">여유 있음 (5대 이상)</button>
                </div>
            </div>
        </section>

        <!-- Main Display Container -->
        <section id="contentContainer">
            <!-- Dynamic Content (Grid/Table/Map) rendered via JS -->
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toastMsg">알림 메세지</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        /**
         * 2. Application State Management
         */
        let rawStations = [];       // Standardized array of station objects
        let activeFilter = 'all';    // 'all' | 'available' | 'zero' | 'plenty'
        let searchQuery = '';       // Filter keyword
        let currentViewMode = 'grid'; // 'grid' | 'table' | 'map'
        let isSampleDataUsed = false;
        let currentAccentColor = 'green';

        /**
         * Dynamic Color Accent Theme Switcher
         */
        function changeAccentColor(colorName) {
            currentAccentColor = colorName;
            document.body.setAttribute('data-color', colorName);

            document.querySelectorAll('.color-dot').forEach(dot => {
                dot.classList.toggle('active', dot.classList.contains(`dot-${colorName}`));
            });

            applyFiltersAndRender();
            showToast(`${colorName === 'green' ? '초록' : colorName === 'blue' ? '파랑' : colorName === 'purple' ? '보라' : '주황'} 테마로 변경되었습니다.`);
        }

        /**
         * Quick Sort Button Trigger
         */
        function setQuickSort(sortVal) {
            const sortSelect = document.getElementById('sortSelect');
            sortSelect.value = sortVal;

            document.getElementById('quickSortDesc').classList.toggle('active', sortVal === 'bike-desc');
            document.getElementById('quickSortAsc').classList.toggle('active', sortVal === 'bike-asc');

            applyFiltersAndRender();
        }

        function handleFilterSort() {
            const val = document.getElementById('sortSelect').value;
            document.getElementById('quickSortDesc').classList.toggle('active', val === 'bike-desc');
            document.getElementById('quickSortAsc').classList.toggle('active', val === 'bike-asc');
            applyFiltersAndRender();
        }

        /**
         * Update badge status UI
         */
        function setSampleDataState(isSample) {
            isSampleDataUsed = isSample;
            const badge = document.getElementById('dataStatusBadge');
            const badgeText = document.getElementById('dataStatusText');

            if (isSample) {
                badge.className = 'status-badge sample';
                badgeText.textContent = '샘플 데이터';
            } else {
                badge.className = 'status-badge live';
                badgeText.textContent = '실시간 데이터';
            }
        }

        /**
         * Update last refreshed timestamp
         */
        function updateTimestamp() {
            const now = new Date();
            const formatted = now.toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
            document.getElementById('lastUpdatedText').textContent = formatted;
        }

        /**
         * 4. Filtering, Searching, and Sorting
         */
        function handleSearchInput() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value.trim().toLowerCase();
            
            const clearBtn = document.getElementById('clearSearchBtn');
            clearBtn.style.display = searchQuery ? 'block' : 'none';

            applyFiltersAndRender();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            applyFiltersAndRender();
        }

        function setStatusFilter(filterType) {
            activeFilter = filterType;
            
            // Update active tab buttons UI
            const buttons = document.querySelectorAll('#statusFilterGroup .tab-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-filter') === filterType) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            applyFiltersAndRender();
        }

        function handleFilterSort() {
            applyFiltersAndRender();
        }

        function getFilteredAndSortedStations() {
            let result = [...rawStations];

            // 1. Search filter
            if (searchQuery) {
                result = result.filter(st => st.stationName.toLowerCase().includes(searchQuery));
            }

            // 2. Status tab filter
            if (activeFilter === 'available') {
                result = result.filter(st => st.parkingBikeTotCnt > 0);
            } else if (activeFilter === 'zero') {
                result = result.filter(st => st.parkingBikeTotCnt === 0);
            } else if (activeFilter === 'plenty') {
                result = result.filter(st => st.parkingBikeTotCnt >= 5);
            }

            // 3. Sorting (Enhanced options for most/least bike count)
            const sortVal = document.getElementById('sortSelect').value;
            result.sort((a, b) => {
                if (sortVal === 'name-asc') {
                    return a.stationName.localeCompare(b.stationName, 'ko-KR');
                } else if (sortVal === 'bike-desc') {
                    return b.parkingBikeTotCnt - a.parkingBikeTotCnt;
                } else if (sortVal === 'bike-asc') {
                    return a.parkingBikeTotCnt - b.parkingBikeTotCnt;
                } else if (sortVal === 'shared-desc') {
                    return b.shared - a.shared;
                } else if (sortVal === 'shared-asc') {
                    return a.shared - b.shared;
                } else if (sortVal === 'rack-desc') {
                    return b.rackTotCnt - a.rackTotCnt;
                }
                return 0;
            });

            return result;
        }

        function applyFiltersAndRender() {
            const filtered = getFilteredAndSortedStations();
            updateKPIs(filtered);
            renderMainContent(filtered);
        }

        /**
         * 5. Update KPI Summary Cards & Visual Overview Chart
         */
        function updateKPIs(stations) {
            const totalCount = stations.length;
            const totalBikes = stations.reduce((acc, st) => acc + st.parkingBikeTotCnt, 0);
            const zeroCount = stations.filter(st => st.parkingBikeTotCnt === 0).length;
            const lowCount = stations.filter(st => st.parkingBikeTotCnt >= 1 && st.parkingBikeTotCnt < 5).length;
            const plentyCount = stations.filter(st => st.parkingBikeTotCnt >= 5).length;
            
            const avgShared = totalCount > 0 
                ? Math.round(stations.reduce((acc, st) => acc + st.shared, 0) / totalCount)
                : 0;

            document.getElementById('kpiTotalStations').textContent = totalCount.toLocaleString();
            document.getElementById('kpiTotalBikes').textContent = totalBikes.toLocaleString();
            document.getElementById('kpiZeroStations').textContent = zeroCount.toLocaleString();
            document.getElementById('kpiAvgShared').textContent = avgShared;

            // Update Visual Stacked Distribution Bar
            const plentyPct = totalCount > 0 ? (plentyCount / totalCount) * 100 : 0;
            const lowPct = totalCount > 0 ? (lowCount / totalCount) * 100 : 0;
            const zeroPct = totalCount > 0 ? (zeroCount / totalCount) * 100 : 0;

            document.getElementById('barPlenty').style.width = `${plentyPct}%`;
            document.getElementById('barLow').style.width = `${lowPct}%`;
            document.getElementById('barZero').style.width = `${zeroPct}%`;

            document.getElementById('countPlentyText').textContent = plentyCount;
            document.getElementById('countLowText').textContent = lowCount;
            document.getElementById('countZeroText').textContent = zeroCount;
            document.getElementById('visualSummaryPercent').textContent = `여유 ${Math.round(plentyPct)}% | 부족 ${Math.round(lowPct)}% | 매진 ${Math.round(zeroPct)}%`;

            const zeroCard = document.getElementById('kpiZeroCard');
            if (zeroCount > 0) {
                zeroCard.classList.add('alert');
            } else {
                zeroCard.classList.remove('alert');
            }
        }

        /**
         * Grid View Renderer with Visual Bike Dots & Gauge
         */
        function renderGridView(container, stations) {
            let html = '<div class="stations-grid">';
            
            stations.forEach(st => {
                const isZero = st.parkingBikeTotCnt === 0;
                const zeroClass = isZero ? 'zero-bikes' : '';
                
                // Progress bar colors
                let barColorStyle = 'background-color: var(--accent-main);';
                if (isZero) barColorStyle = 'background-color: var(--bike-red);';
                else if (st.parkingBikeTotCnt < 3) barColorStyle = 'background-color: var(--bike-amber);';

                const pct = Math.min(100, Math.round((st.parkingBikeTotCnt / (st.rackTotCnt || 1)) * 100));

                // Generate Visual Bike Dot Elements (Up to 15 max for clean visual representation)
                const maxVisualDots = Math.min(st.rackTotCnt || 10, 15);
                let dotsHtml = '<div class="bike-visual-dots" title="시각적 자전거 수량 도트">';
                if (isZero) {
                    dotsHtml += `<span class="bike-dot zero-dot" style="width:100%; height:8px; border-radius:4px;" title="자전거 0대"></span>`;
                } else {
                    for (let i = 0; i < maxVisualDots; i++) {
                        const filled = i < st.parkingBikeTotCnt;
                        dotsHtml += `<span class="bike-dot ${filled ? '' : 'empty'}"></span>`;
                    }
                }
                dotsHtml += '</div>';

                html += `
                    <div class="station-card ${zeroClass}">
                        <div>
                            <div class="station-header">
                                <h3 class="station-name">${escapeHtml(st.stationName)}</h3>
                                <span class="station-id">${escapeHtml(st.stationId || 'ID')}</span>
                            </div>

                            <div class="station-metrics">
                                <div class="metric-item">
                                    <span class="metric-label">대여 가능</span>
                                    <span class="metric-val ${isZero ? 'zero-text' : ''}" style="${!isZero ? 'color: var(--accent-main);' : ''}">
                                        ${st.parkingBikeTotCnt} <span style="font-size:0.85rem; font-weight:500;">대</span>
                                    </span>
                                </div>
                                <div class="metric-item">
                                    <span class="metric-label">총 거치대 수</span>
                                    <span class="metric-val">
                                        ${st.rackTotCnt} <span style="font-size:0.85rem; font-weight:500;">개</span>
                                    </span>
                                </div>
                            </div>

                            <!-- Visual Bike Dots -->
                            ${dotsHtml}

                            <div class="progress-section">
                                <div class="progress-header">
                                    <span>거치대 점유율</span>
                                    <span>${st.shared}% (${pct}%)</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${Math.min(100, pct)}%; ${barColorStyle}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer">
                            <span>상태</span>
                            ${isZero 
                                ? `<span class="badge-status badge-zero">대여 불가 (0대)</span>` 
                                : `<span class="badge-status" style="background-color: var(--accent-bg); color: var(--accent-main);">대여 가능</span>`
                            }
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        /**
         * Table View Renderer with Visual Mini Bars
         */
        function renderTableView(container, stations) {
            let html = `
                <div class="table-container">
                    <table class="responsive-table">
                        <thead>
                            <tr>
                                <th>대여소 ID</th>
                                <th>대여소 이름</th>
                                <th>대여 가능 자전거</th>
                                <th>시각적 잔여량</th>
                                <th>총 거치대 수</th>
                                <th>거치율</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            stations.forEach(st => {
                const isZero = st.parkingBikeTotCnt === 0;
                const rowClass = isZero ? 'zero-row' : '';
                const pct = Math.min(100, Math.round((st.parkingBikeTotCnt / (st.rackTotCnt || 1)) * 100));
                
                let barColor = isZero ? 'var(--bike-red)' : (st.parkingBikeTotCnt < 3 ? 'var(--bike-amber)' : 'var(--accent-main)');

                html += `
                    <tr class="${rowClass}">
                        <td><span class="station-id">${escapeHtml(st.stationId || '-')}</span></td>
                        <td style="font-weight:700;">${escapeHtml(st.stationName)}</td>
                        <td>
                            <strong class="${isZero ? 'zero-text' : ''}" style="${!isZero ? 'color: var(--accent-main);' : ''}">${st.parkingBikeTotCnt} 대</strong>
                        </td>
                        <td style="width: 140px;">
                            <div class="progress-bar-bg" style="height: 6px;">
                                <div class="progress-bar-fill" style="width: ${pct}%; background-color: ${barColor};"></div>
                            </div>
                        </td>
                        <td>${st.rackTotCnt} 개</td>
                        <td>${st.shared}%</td>
                        <td>
                            ${isZero 
                                ? `<span class="badge-status badge-zero">대여 불가</span>` 
                                : `<span class="badge-status" style="background-color: var(--accent-bg); color: var(--accent-main);">대여 가능</span>`
                            }
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        /**
         * SVG Interactive Map Renderer
         */
        function renderMapView(container, stations) {
            let minLat = Infinity, maxLat = -Infinity;
            let minLng = Infinity, maxLng = -Infinity;

            stations.forEach(s => {
                if (s.stationLatitude < minLat) minLat = s.stationLatitude;
                if (s.stationLatitude > maxLat) maxLat = s.stationLatitude;
                if (s.stationLongitude < minLng) minLng = s.stationLongitude;
                if (s.stationLongitude > maxLng) maxLng = s.stationLongitude;
            });

            // Prevent divide by zero if 1 station
            if (minLat === maxLat) { minLat -= 0.005; maxLat += 0.005; }
            if (minLng === maxLng) { minLng -= 0.005; maxLng += 0.005; }

            const width = 800;
            const height = 400;
            const padding = 50;

            let circlesSvg = '';

            stations.forEach((st, idx) => {
                // Map lat/lng to canvas relative positions
                const x = padding + ((st.stationLongitude - minLng) / (maxLng - minLng)) * (width - 2 * padding);
                const y = height - (padding + ((st.stationLatitude - minLat) / (maxLat - minLat)) * (height - 2 * padding));

                const isZero = st.parkingBikeTotCnt === 0;
                const fillColor = isZero ? '#ef4444' : '#10b981';

                circlesSvg += `
                    <g class="map-pin" data-idx="${idx}" transform="translate(${x}, ${y})">
                        <circle r="14" fill="${fillColor}" opacity="0.2"></circle>
                        <circle r="8" fill="${fillColor}" stroke="#ffffff" stroke-width="2"></circle>
                    </g>
                `;
            });

            const html = `
                <div class="map-wrapper">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.9rem; font-weight:700;">대여소 지점 분포도 (위도/경도 기반)</span>
                        <div style="font-size:0.75rem; display:flex; gap:1rem;">
                            <span style="color: var(--bike-green);">● 대여 가능</span>
                            <span style="color: var(--bike-red);">● 대여 불가 (0대)</span>
                        </div>
                    </div>
                    <div class="svg-map-container" id="mapSvgContainer">
                        <div id="mapTooltip" class="map-tooltip"></div>
                        <svg class="svg-map" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
                            <!-- Background Grid Lines -->
                            <line x1="0" y1="100" x2="${width}" y2="100" stroke="var(--border-color)" stroke-dasharray="4"></line>
                            <line x1="0" y1="200" x2="${width}" y2="200" stroke="var(--border-color)" stroke-dasharray="4"></line>
                            <line x1="0" y1="300" x2="${width}" y2="300" stroke="var(--border-color)" stroke-dasharray="4"></line>
                            <line x1="200" y1="0" x2="200" y2="${height}" stroke="var(--border-color)" stroke-dasharray="4"></line>
                            <line x1="400" y1="0" x2="400" y2="${height}" stroke="var(--border-color)" stroke-dasharray="4"></line>
                            <line x1="600" y1="0" x2="600" y2="${height}" stroke="var(--border-color)" stroke-dasharray="4"></line>

                            ${circlesSvg}
                        </svg>
                    </div>
                </div>
            `;

            container.innerHTML = html;

            // Attach SVG Tooltip events
            const pins = container.querySelectorAll('.map-pin');
            const tooltip = document.getElementById('mapTooltip');
            const mapContainer = document.getElementById('mapSvgContainer');

            pins.forEach(pin => {
                pin.addEventListener('mouseenter', (e) => {
                    const idx = pin.getAttribute('data-idx');
                    const st = stations[idx];
                    
                    tooltip.innerHTML = `
                        <strong>${escapeHtml(st.stationName)}</strong><br/>
                        대여가능: <span style="color:${st.parkingBikeTotCnt === 0 ? 'var(--bike-red)' : 'var(--bike-green)'}; font-weight:bold;">${st.parkingBikeTotCnt}대</span> / 전체 ${st.rackTotCnt}개
                    `;
                    tooltip.style.display = 'block';
                });

                pin.addEventListener('mousemove', (e) => {
                    const rect = mapContainer.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    tooltip.style.left = `${mouseX + 12}px`;
                    tooltip.style.top = `${mouseY - 20}px`;
                });

                pin.addEventListener('mouseleave', () => {
                    tooltip.style.display = 'none';
                });
            });
        }

        /**
         * 7. Utilities & Helpers
         */
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);

            const themeIcon = document.getElementById('themeIcon');
            if (next === 'dark') {
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            } else {
                themeIcon.innerHTML = `
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                `;
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
